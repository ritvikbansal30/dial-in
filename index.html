<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dial-In">
<meta name="theme-color" content="#1B1816">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Dial-In Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Yellowtail&display=swap">
<style>
/* Layout: one phone-width column; sticky title bar, content, fixed action dock at the bottom. */
:root{
  --bg:#E8E1D5; --surface:#F5F0E7; --ink:#1F1B18; --muted:#6D645B; --line:#CDC2B2;
  --btn:#1F1B18; --btn-ink:#F5F0E7; --accent:#A8641E; --danger:#B3261E; --scrim:rgba(20,16,13,.55);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-look="light"]){
    --bg:#1B1816; --surface:#272220; --ink:#EFE7DB; --muted:#A3998E; --line:#3B342F;
    --btn:#EFE7DB; --btn-ink:#1B1816; --accent:#E2A25C; --danger:#EF6A60; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-look="light"]), :root[data-look="dark"]{
  --bg:#1B1816; --surface:#272220; --ink:#EFE7DB; --muted:#A3998E; --line:#3B342F;
  --btn:#EFE7DB; --btn-ink:#1B1816; --accent:#E2A25C; --danger:#EF6A60; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-look="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

/* ---------- title bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:72px 1fr 72px;align-items:center;min-height:58px;margin:0 -4px}
.bar h1{margin:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .l{justify-self:start}.bar .r{justify-self:end}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon svg{width:24px;height:24px}
.txtbtn{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:10px 4px}
.txtbtn[disabled]{opacity:.35;cursor:default}

/* ---------- segmented ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);padding:4px;gap:4px}
.seg button{padding:9px 6px;font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.kicker{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 12px;letter-spacing:.02em}

/* ---------- the bag card ---------- */
.bag{--l:#A63D40;--li:#F5EFE6;--p:#EFE4D2;--i:#1E1A17;--b:#F2C4B8;--bi:#1E1A17;
  position:relative;font-size:var(--bag-fs,16px);background:var(--p);color:var(--i);padding:1.25em 1.15em 1.35em;width:100%;text-align:left;overflow:hidden}
.bag-notes{font-family:var(--f-display);font-weight:700;font-size:1.3em;text-transform:uppercase;text-align:center;letter-spacing:.03em;line-height:1.05;min-height:2.1em;display:flex;align-items:center;justify-content:center;text-wrap:balance;overflow-wrap:anywhere}
.bag-label{margin-top:.75em;background:var(--l);color:var(--li);padding:1.15em .8em 1.05em;text-align:center;border:.16em solid var(--i);min-height:8.4em;display:flex;flex-direction:column;justify-content:center;gap:.45em;position:relative}
.bag-label.st-banded::before,.bag-label.st-banded::after{content:"";position:absolute;left:0;right:0;height:.32em;background:var(--li);opacity:.9}
.bag-label.st-banded::before{top:.55em}.bag-label.st-banded::after{bottom:.55em}
.bag-label.st-outline{background:var(--p);color:var(--l);border:.38em double var(--l)}
.bag-name{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:.01em;overflow-wrap:break-word;hyphens:auto;text-wrap:balance}
.bag-name.n-s{font-size:2.5em}.bag-name.n-m{font-size:1.95em}.bag-name.n-l{font-size:1.6em}.bag-name.n-xl{font-size:1.3em}
.f-serif .bag-name{font-family:"DM Serif Display",Georgia,serif;font-weight:400;text-transform:none;line-height:1.02}
.f-mono .bag-name{font-family:var(--f-mono);font-weight:600;letter-spacing:-.02em;line-height:1.05}
.f-mono .bag-name.n-s{font-size:2em}.f-mono .bag-name.n-m{font-size:1.55em}.f-mono .bag-name.n-l{font-size:1.2em}.f-mono .bag-name.n-xl{font-size:1em}
.f-script .bag-name{font-family:Yellowtail,"Brush Script MT",cursive;font-weight:400;text-transform:none;line-height:1.05}
.bag-sub{font-family:var(--f-mono);font-weight:500;font-size:.6em;letter-spacing:.24em;text-transform:uppercase;line-height:1.5;overflow-wrap:anywhere}
.bag-table{margin-top:.85em;border:.12em solid var(--i);display:grid;grid-template-columns:1fr 1fr}
.bag-band{grid-column:1/-1;background:var(--b);color:var(--bi);display:flex;justify-content:space-between;align-items:center;padding:.55em .75em;font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.03em;border-bottom:.12em solid var(--i)}
.bag-cell{font-family:var(--f-mono);font-weight:500;font-size:.6em;text-transform:uppercase;text-align:center;padding:.85em .35em;border-bottom:.2em solid var(--i);overflow-wrap:anywhere;line-height:1.25;font-variant-numeric:tabular-nums}
.bag-cell.lc{border-right:.2em solid var(--i)}
.bag-stars{grid-column:1/-1;text-align:center;font-size:1.05em;letter-spacing:.18em;padding:.35em 0 .3em}
.bag-stars .off{opacity:.25}
.ph{opacity:.45}
.stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);border:.18em solid var(--i);color:var(--i);background:var(--p);font-family:var(--f-display);font-weight:900;font-size:1.6em;padding:.1em .5em;letter-spacing:.1em;box-shadow:0 0 0 .2em var(--p)}

/* ---------- home rail ---------- */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:0 0 84%;scroll-snap-align:center;--bag-fs:clamp(14px,4.3vw,17px)}
.rail-item:only-child{flex-basis:100%}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0}
.dots i{width:10px;height:3px;background:var(--line)}
.dots i.on{background:var(--ink);width:18px}
.empty{text-align:center}
.empty .bag{opacity:.55;--bag-fs:15px}
.ex-tag{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);padding:3px 8px;margin-bottom:10px}
.empty p{color:var(--muted);margin:14px auto 0;max-width:30ch}

/* ---------- dock & buttons ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:448px;margin:0 auto;display:grid;gap:10px}
.btn{width:100%;padding:15px 12px;background:var(--btn);color:var(--btn-ink);font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn[disabled]{opacity:.35;cursor:default}

/* ---------- detail ---------- */
.detail-card{--bag-fs:clamp(14px,4.4vw,17px);margin-top:4px}
.rate{display:flex;flex-direction:column;align-items:center;gap:4px;margin:20px 0 6px}
.rate span{font-size:13px;color:var(--muted)}
.stars-in{display:flex;gap:2px}
.stars-in button{font-size:32px;line-height:1;width:44px;height:44px;color:var(--ink)}
.stars-in button.off{opacity:.22}
.stars-in.sm button{font-size:24px;width:36px;height:36px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.sec-h small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.logs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.log{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line)}
.log-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.log-head b{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.log-head span{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-head em{flex:0 0 auto;font-style:normal;font-size:14px;letter-spacing:.1em}
.log-grid{display:grid;grid-template-columns:repeat(3,1fr)}
.log-grid div{padding:9px 6px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.log-grid div:nth-child(3n){border-right:0}
.log-grid div:nth-last-child(-n+3){border-bottom:0}
.log-grid strong{display:block;font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.log-grid small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.log-note{padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.none{color:var(--muted);text-align:center;padding:22px 10px;border:1px dashed var(--line)}

/* ---------- forms ---------- */
.preview{--bag-fs:13px;max-width:300px;margin:4px auto 0}
.preview-sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:3;background:var(--bg);padding-bottom:12px}
.preview-sticky .preview{--bag-fs:11px;max-width:250px}
.lead{text-align:center;margin:10px 0 2px}
.lead h2{margin:0;font-size:20px;font-weight:600}
.lead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.group{margin-top:22px}
.group > label,.glabel{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.fields{display:grid;gap:20px;margin-top:18px}
.field label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.field label .cnt{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
.field label .cnt.full{color:var(--accent)}
.inrow{display:flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--line)}
.inrow:focus-within{border-color:var(--ink)}
.inrow input,.inrow select,.field textarea{flex:1;min-width:0;width:100%;background:transparent;border:0;color:var(--ink);font:500 17px/1.3 var(--f-body);padding:8px 0;outline:none;-webkit-appearance:none;appearance:none;border-radius:0}
.inrow select{padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.inrow select option{color:#1F1B18;background:#fff}
.inrow input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.7}
.inrow .suf{color:var(--muted);font-weight:500}
.field textarea{border:1.5px solid var(--line);padding:10px;min-height:96px;resize:vertical;margin-top:6px}
.field textarea:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 12px;border:1.5px solid var(--ink);font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip.sm{padding:5px 10px;font-size:13px;border-width:1px;border-color:var(--line);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.ratio{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-size:14px}
.ratio b{font-family:var(--f-mono);font-weight:600;font-size:16px}
.delete-link{display:block;margin:30px auto 0;color:var(--danger);font-weight:600;padding:10px}

/* theme grid */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tchip{display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:center;min-width:0}
.sw{aspect-ratio:3/4;max-width:100%;padding:12% 12% 0;display:flex;flex-direction:column;gap:8%;border:2px solid transparent;outline:1px solid var(--line)}
.sw i{display:block;flex:0 0 46%;border:2px solid var(--swi)}
.sw u{display:block;flex:0 0 14%;border:2px solid var(--swi)}
.tchip.on .sw{border-color:var(--ink);outline:2px solid var(--ink)}
.tchip span{font-size:11.5px;line-height:1.2;color:var(--muted);overflow-wrap:anywhere}
.tchip.on span{color:var(--ink);font-weight:600}
.custom{margin-top:14px;background:var(--surface);border:1px solid var(--line);padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.custom label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);align-items:center;text-align:center}
.custom input{width:100%;max-width:64px;height:44px;border:1px solid var(--line);padding:2px;background:transparent}

/* ---------- sheets, dialogs, toast ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:480px;background:var(--bg);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;animation:up .22s ease}
.sheet h3{margin:0 0 4px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.sheet p{margin:0 0 6px;text-align:center;color:var(--muted)}
.sheet img{display:block;width:100%;max-width:320px;margin:0 auto;border:1px solid var(--line)}
.scrim.center{align-items:center;padding:16px}
.scrim.center .sheet{max-width:400px;padding:22px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--btn);color:var(--btn-ink);padding:10px 16px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center;animation:fade .2s ease}

/* ---------- added ---------- */
.added{text-align:center;padding-top:10px}
.added h2{font-family:var(--f-display);font-weight:900;font-size:40px;text-transform:uppercase;margin:14px 0 2px;letter-spacing:.02em}
.added p{color:var(--muted);margin:0 0 18px}
.added .bag{--bag-fs:15px;max-width:320px;margin:0 auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:12px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- settings ---------- */
.set-h{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:26px 0 4px}
.set-p{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.rows{display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);padding:14px;width:100%;text-align:left;font-weight:500}
.row small{color:var(--muted);font-weight:400}
.status{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);padding:12px 14px;font-size:14px}
.status i{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px;background:var(--accent)}
.status.ok i{background:#3F8F5A}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);padding:12px 8px;text-align:center}
.stats b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.nudge{display:block;width:100%;margin:12px 0 -4px;padding:10px 12px;border:1px dashed var(--line);color:var(--muted);font-size:13.5px;text-align:center}
.authbox{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);padding:16px}
.authbox .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.authbox .btn{font-size:16px;padding:12px 8px}
.msg{font-size:13.5px;color:var(--muted);min-height:1em}
.msg.err{color:var(--danger)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto!important}}
@media (min-width:600px){.tgrid{grid-template-columns:repeat(5,1fr)}}
</style>

</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(() => {
"use strict";

/* ================= constants ================= */
const DARK = "#1E1A17", LIGHT = "#F5EFE6";
const THEMES = [
  {id:"crimson",  name:"Crimson",      label:"#A63D40", paper:"#EFE4D2", band:"#F0C2B4"},
  {id:"harbour",  name:"Harbour",      label:"#3E6E6B", paper:"#EDE6D9", band:"#B7D9D8"},
  {id:"night",    name:"Night Shift",  label:"#23262E", paper:"#E9E4DA", band:"#B9C7DF"},
  {id:"saffron",  name:"Saffron",      label:"#D9991E", paper:"#F3EBDC", band:"#F6D98C"},
  {id:"plum",     name:"Plum Jam",     label:"#6B3A5B", paper:"#EFE5E8", band:"#E2C2D5"},
  {id:"fern",     name:"Fern",         label:"#4E6B3A", paper:"#ECEAD8", band:"#C9D9A6"},
  {id:"terra",    name:"Terracotta",   label:"#C0643B", paper:"#F1E6DA", band:"#F1C29E"},
  {id:"cobalt",   name:"Cobalt",       label:"#2F4FA2", paper:"#E9EAF0", band:"#BCCBF2"},
  {id:"pista",    name:"Pistachio",    label:"#A3BC80", paper:"#F2F0E3", band:"#DCE8C1"},
  {id:"blush",    name:"Blush",        label:"#E5A79F", paper:"#F7EDE8", band:"#F6D3C8"},
  {id:"cocoa",    name:"Cocoa",        label:"#5A3B2C", paper:"#EADFD1", band:"#D7B99B"},
  {id:"lagoon",   name:"Lagoon",       label:"#1F8A8A", paper:"#E7F0EE", band:"#A9DDD6"},
  {id:"lavender", name:"Lavender",     label:"#8E7CC3", paper:"#EFEBF5", band:"#D4CBEE"},
  {id:"tangerine",name:"Tangerine",    label:"#EE7B30", paper:"#FBF0E2", band:"#FFD0A1"},

];

const FONTS = [["condensed","Bold"],["serif","Serif"],["mono","Mono"],["script","Script"]];

/* ================= helpers ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDot = s => { if (!s) return ""; const [y,m,d] = s.split("-"); return `${d}.${m}.${y}`; };
const fmtLong = s => { if (!s) return ""; const [y,m,d] = s.split("-"); return `${+d} ${MON[+m-1]} ${y}`; };
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || "");
function inkFor(hex){
  if (!isHex(hex)) return DARK;
  const n = parseInt(hex.slice(1), 16), ch = [n>>16 & 255, n>>8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
  return (0.2126*ch[0] + 0.7152*ch[1] + 0.0722*ch[2]) > 0.32 ? DARK : LIGHT;
}
function themeOf(b){
  let t;
  if (b.theme === "custom") {
    const c = b.custom || {};
    t = {label: isHex(c.label) ? c.label : "#7A4B2A", paper: isHex(c.paper) ? c.paper : "#EFE6D8", band: isHex(c.band) ? c.band : "#E8C9A0"};
  } else t = THEMES.find(x => x.id === b.theme) || THEMES[0];
  return {label:t.label, paper:t.paper, band:t.band, li:inkFor(t.label), ink:inkFor(t.paper), bi:inkFor(t.band)};
}
const cardVars = t => `--l:${t.label};--li:${t.li};--p:${t.paper};--i:${t.ink};--b:${t.band};--bi:${t.bi}`;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const cleanNum = (v, max) => { v = String(v).replace(",", ".").replace(/[^0-9.]/g, ""); const i = v.indexOf("."); if (i >= 0) v = v.slice(0, i+1) + v.slice(i+1).replace(/\./g, ""); return v.slice(0, max); };
const toUnit = c => c == null ? "" : String(state.settings.tempUnit === "F" ? Math.round(c*9/5+32) : Math.round(c*10)/10);
const fromUnit = v => { const n = num(v); if (n == null) return null; return state.settings.tempUnit === "F" ? Math.round((n-32)*5/9*10)/10 : n; };
const tempTxt = c => c == null ? "—" : `${toUnit(c)}°${state.settings.tempUnit}`;
const ratioOf = (dose, out) => { const d = num(dose), o = num(out); return d && o ? "1:" + (Math.round(o/d*10)/10) : "—"; };
const timeTxt = s => { if (s == null || s === "") return "—"; s = +s; const m = Math.floor(s/60), r = s % 60; return m ? `${m}m ${String(r).padStart(2,"0")}s` : `${r}s`; };
const starsTxt = n => [1,2,3,4,5].map(i => i <= (n||0) ? "★" : '<span class="off">★</span>').join("");

const IC = {
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',

/* ================= state ================= */
const DEFAULT_SETTINGS = {tempUnit:"C", look:"auto"};
const state = {
  mode:"pour", beans:[], settings:{...DEFAULT_SETTINGS},
  screen:"home", params:{}, draft:null, logDraft:null, overlay:null,
  railIndex:{pour:0, espresso:0}, storage:"loading",
};
const LS_KEY = "dialin.v1";
function readLocal(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function writeLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({beans:state.beans, settings:state.settings, mode:state.mode, synced: state.storage === "synced" || !!state.wasSynced})); } catch {} }

/* ================= storage (account sync via db, fallback to this browser) ================= */
const Store = {
  col:null, queues:{},
  enqueue(key, fn){ const p = (this.queues[key] || Promise.resolve()).catch(()=>{}).then(fn); this.queues[key] = p.catch(()=>{}); return p; },
  write(key, fn){ if (!this.col) return; this.enqueue(key, fn).catch(e => { toast(e && e.code === "quota_exceeded" ? "Storage is full. Remove some old beans." : "Couldn't sync that change. It's kept on this device."); }); },
  saveBean(b){
    b = clone(b); b.kind = "bean"; b.updatedAt = Date.now();
    const i = state.beans.findIndex(x => x.id === b.id);
    if (i >= 0) state.beans[i] = b; else state.beans.push(b);
    writeLocal(); Cloud.touch(b.id);
    this.write(b.id, () => this.col.doc(b.id).set(b));
    return b;
  },
  deleteBean(id){
    state.beans = state.beans.filter(x => x.id !== id); writeLocal(); Cloud.touch(id);
    this.write(id, () => this.col.doc(id).delete());
  },
  saveSettings(){
    writeLocal(); applyLook(); Cloud.touch("settings");
    this.write("settings", () => this.col.doc("settings").set(clone(state.settings)));
  },
  async init(){
    const local = readLocal();
    if (local) { state.wasSynced = !!local.synced; state.beans = local.beans || []; state.settings = {...DEFAULT_SETTINGS, ...(local.settings||{})}; if (local.mode) state.mode = local.mode; }
    applyLook(); render();
    let db = null, user = null;
    try { if (window.claude && claude.use) [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch {}
    const id = user ? await user.id().catch(() => null) : null;
    if (!db || !id) { Cloud.init(); return; }
    this.col = db.collection("data/users/" + id);
    let settled = false;
    this.col.onSnapshot(snap => {
      if (snap.empty && snap.metadata.fromCache) return;
      if (!settled && !snap.metadata.fromCache) {
        settled = true;
        if (snap.empty && state.beans.length && !state.wasSynced) {           // first run on the account: move this browser's beans up
          state.beans.forEach(b => this.write(b.id, () => this.col.doc(b.id).set({...clone(b), kind:"bean"})));
          this.write("settings", () => this.col.doc("settings").set(clone(state.settings)));
          state.storage = "synced"; softRender(); return;
        }
      }
      const beans = []; let settings = null;
      snap.docs.forEach(d => { const v = d.data(); if (!v) return; if (d.id === "settings") settings = v; else if (v.kind === "bean") beans.push(clone(v)); });
      state.beans = beans;
      if (settings) state.settings = {...DEFAULT_SETTINGS, ...settings};
      state.storage = "synced";
      writeLocal(); applyLook(); softRender();
    }, () => { state.storage = "local"; this.col = null; softRender(); });
  }
};

function applyLook(){
  const r = document.documentElement;
  if (state.settings.look === "light" || state.settings.look === "dark") r.setAttribute("data-look", state.settings.look);
  else r.removeAttribute("data-look");
}

/* ================= card ================= */
function cardHTML(b, opt = {}){

  const sub = [b.brand, b.origin].filter(Boolean).map(esc).join("<br>");
  const cnt = (b.logs || []).length;
  const word = b.mode === "espresso" ? "Shots logged" : "Pours logged";
  const c = (v, ph) => v ? esc(v) : `<span class="ph">${ph}</span>`;
  return `<div class="bag f-${esc(b.labelFont||"condensed")}" style="${cardVars(t)}">
    <div class="bag-notes">${b.flavour ? esc(b.flavour) : '<span class="ph">Flavour notes</span>'}</div>
    <div class="bag-label st-${esc(b.labelStyle||"block")}">
      <div class="bag-name ${nCls}${noName ? " ph" : ""}">${esc(shown)}</div>
      <div class="bag-sub">${sub || '<span class="ph">Roaster · Origin</span>'}</div>
    </div>
    <div class="bag-table">
      <div class="bag-band"><span>${word}</span><span>${opt.placeholder && !cnt ? "--" : cnt}</span></div>
      <div class="bag-cell lc">${c(b.roast && b.roast + " roast", "-- roast")}</div>
      <div class="bag-cell">${c(b.process, "-- process")}</div>
      <div class="bag-cell lc">${c(fmtDot(b.roastDate), "-- date")}</div>
      <div class="bag-cell">${c(b.grams && b.grams + " g", "-- g")}</div>
      <div class="bag-stars" aria-label="${b.rating||0} of 5 stars">${starsTxt(b.rating)}</div>

}

function logCells(b, g){

  return [
    [g.dose ? g.dose+" g" : "—","Dose"],[g.water ? g.water+" g" : "—","Water"],[ratioOf(g.dose,g.water),"Ratio"],
    [timeTxt(g.time),"Time"],[g.grind||"—","Grind"],[temp,"Temp"]];

const VIEWS = {home:vHome, detail:vDetail, "bean-theme":vTheme, "bean-form":vBeanForm, added:vAdded, "log-form":vLog, settings:vSettings};
let lastScreen = null;
function render(){
  const app = document.getElementById("app");
  app.innerHTML = (VIEWS[state.screen] || vHome)();
  document.getElementById("layer").innerHTML = vOverlay();
  if (state.screen !== lastScreen) { window.scrollTo(0, 0); lastScreen = state.screen; }
  const rail = document.getElementById("rail");
  if (rail) {
    const items = rail.children, idx = Math.min(state.railIndex[state.mode] || 0, items.length - 1);
    if (items[idx]) rail.scrollLeft = items[idx].offsetLeft - (rail.clientWidth - items[idx].clientWidth) / 2;
    rail.addEventListener("scroll", onRailScroll, {passive:true});
  }
}
function softRender(){
  if (["home","detail","settings","added"].includes(state.screen)) {
    if (state.overlay && state.overlay.type === "share") return;
    render();
  }
}
let railT;
function onRailScroll(e){
  clearTimeout(railT);
  railT = setTimeout(() => {
    const rail = e.target, items = [...rail.children], mid = rail.scrollLeft + rail.clientWidth / 2;
    let best = 0, bd = Infinity;
    items.forEach((it, i) => { const d = Math.abs(it.offsetLeft + it.clientWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
    state.railIndex[state.mode] = best;
    document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i === best));
  }, 60);
}
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
function confetti(b){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t = themeOf(b), cols = [t.label, t.band, t.paper, "#E2A25C", "#F5EFE6"];
  const box = document.createElement("div"); box.className = "confetti";
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.cssText = `left:${Math.random()*100}%;background:${cols[i % cols.length]};animation-duration:${1.8+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*180}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}

/* ================= saving files outside Claude ================= */
async function getSaver(){
  try { if (window.claude && claude.use) { const dl = await claude.use("downloads"); if (dl) return dl; } } catch {}
  return { async save({filename, data}){
    const type = filename.endsWith(".png") ? "image/png" : "application/json";
    const blob = data instanceof Blob ? data : new Blob([data], {type});
    const file = new File([blob], filename, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file]}); return {status:"saved"}; }
      catch (e) { if (e && e.name === "AbortError") throw {code:"declined"}; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return {status:"saved"};
  }};
}

/* ================= Supabase cloud sync ================= */
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 10 ? "just now" : s < 60 ? s + "s ago" : s < 3600 ? Math.round(s/60) + " min ago" : Math.round(s/3600) + " h ago"; };
const Cloud = {
  sb:null, user:null, status:"off", msg:"", lastSync:0, dirty:new Set(), busy:false, again:false, timer:null, rt:null, chan:null,
  lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } },
  lsSet(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  saveDirty(){ this.lsSet("dialin.dirty", JSON.stringify([...this.dirty])); },
  async init(){
    const cfg = window.DIALIN_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) { this.status = "off"; state.storage = "local"; softRender(); return; }
    try { this.dirty = new Set(JSON.parse(this.lsGet("dialin.dirty") || "[]")); } catch {}
    this.sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true}});
    const { data } = await this.sb.auth.getSession();
    this.setUser(data && data.session ? data.session.user : null);
    this.sb.auth.onAuthStateChange((_e, session) => {
      const u = session ? session.user : null;
      if ((u && u.id) !== (this.user && this.user.id)) this.setUser(u);
    });
    addEventListener("online", () => this.sync());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.sync(); });
  },
  setUser(u){
    this.user = u;
    if (!u) { this.unsub(); this.status = "signedout"; state.storage = "local"; softRender(); return; }
    if (this.lsGet("dialin.syncUser") !== u.id) {          // first sign-in on this phone: upload what's here
      state.beans.forEach(b => this.dirty.add(b.id)); this.dirty.add("settings"); this.saveDirty();
      this.lsSet("dialin.syncUser", u.id);
    }
    this.status = "syncing"; softRender();
    this.subscribe(); this.sync();
  },
  touch(id){
    if (!this.sb) return;
    this.dirty.add(id); this.saveDirty();
    if (!this.user) return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), 700);
  },
  async sync(){
    if (!this.sb || !this.user) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setStatus("syncing");
    const uid = this.user.id;
    try {
      for (const id of [...this.dirty]) {
        let res;
        if (id === "settings") res = await this.sb.from("settings").upsert({user_id:uid, data:state.settings, updated_at:new Date().toISOString()});
        else {
          const b = state.beans.find(x => x.id === id);
          res = b ? await this.sb.from("beans").upsert({id, user_id:uid, data:b, updated_at:new Date(b.updatedAt || Date.now()).toISOString()}, {onConflict:"user_id,id"})
                  : await this.sb.from("beans").delete().eq("id", id);
        }
        if (res.error) throw res.error;
        this.dirty.delete(id); this.saveDirty();
      }
      const [beansRes, setRes] = await Promise.all([this.sb.from("beans").select("id,data"), this.sb.from("settings").select("data").maybeSingle()]);
      if (beansRes.error) throw beansRes.error;
      if (setRes.error) throw setRes.error;
      const remote = new Map(beansRes.data.map(r => [r.id, r.data]));
      const merged = [];
      state.beans.forEach(b => {
        if (this.dirty.has(b.id)) merged.push(b);
        else if (remote.has(b.id)) { const r = remote.get(b.id); merged.push((r.updatedAt || 0) >= (b.updatedAt || 0) ? r : b); }
        // otherwise it was removed on another device
      });
      remote.forEach((r, id) => { if (!merged.some(b => b.id === id)) merged.push(r); });
      state.beans = merged;
      if (setRes.data && setRes.data.data && !this.dirty.has("settings")) state.settings = {...DEFAULT_SETTINGS, ...setRes.data.data};
      writeLocal(); applyLook();
      this.lastSync = Date.now(); this.setStatus("synced"); softRender();
    } catch (err) {
      this.setStatus(navigator.onLine === false ? "offline" : "error", err && err.message);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.sync(); }
    }
  },
  subscribe(){
    this.unsub();
    this.chan = this.sb.channel("beans-" + this.user.id)
      .on("postgres_changes", {event:"*", schema:"public", table:"beans", filter:"user_id=eq." + this.user.id}, () => { clearTimeout(this.rt); this.rt = setTimeout(() => this.sync(), 600); })
      .subscribe();
  },
  unsub(){ if (this.chan) { this.sb.removeChannel(this.chan); this.chan = null; } },
  setStatus(s, m){
    this.status = s; this.msg = m || "";
    if (s === "synced" || s === "syncing") state.storage = "cloud";
    const el = document.getElementById("sync-status"); if (el) el.outerHTML = statusHTML();
  },
};
function statusHTML(){
  const c = Cloud, map = {
    synced: ["ok", `Synced to your account · ${ago(c.lastSync)}`],
    syncing: ["", "Syncing…"],
    offline: ["", "Offline. Changes are saved on this phone and will sync when you're back online."],
    error: ["", `Couldn't sync${c.msg ? ": " + c.msg : ""}. Changes are kept on this phone.`],
  }[c.status] || ["", "Connecting…"];
  return `<div class="status ${map[0]}" id="sync-status"><i></i><span>${esc(map[1])}</span></div>`;
}
function cloudHTML(){
  const c = Cloud;
  if (c.status === "off") return `<div class="status"><i></i><span>Cloud sync isn't set up. Add your Supabase project URL and key to config.js. Until then, beans are saved on this phone only.</span></div>`;
  if (!c.user) return `<p class="set-p">Sign in to back up your beans and see them on every device. Everything already on this phone gets uploaded.</p>
    <div class="authbox">
      <div class="field"><label for="c-email"><span>Email</span></label><div class="inrow"><input id="c-email" type="email" autocomplete="email" autocapitalize="off" placeholder="you@example.com"></div></div>
      <div class="field"><label for="c-pass"><span>Password</span></label><div class="inrow"><input id="c-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div></div>
      <div class="btns"><button class="btn" data-act="c-signin">Sign in</button><button class="btn ghost" data-act="c-signup">Create account</button></div>
      <div class="msg" id="c-msg" role="status"></div>
    </div>`;
  return `${statusHTML()}
    <div class="rows" style="margin-top:8px">
      <div class="row"><span>Signed in<br><small>${esc(c.user.email || "")}</small></span></div>
      <button class="row" data-act="c-sync"><span>Sync now</span><span>↻</span></button>
      <button class="row" data-act="c-ask-signout"><span>Sign out</span><span>›</span></button>
    </div>`;
}
function authMsg(t, err){ const m = document.getElementById("c-msg"); if (m) { m.textContent = t; m.classList.toggle("err", !!err); } }
function authInputs(){
  const email = (document.getElementById("c-email") || {}).value || "", pw = (document.getElementById("c-pass") || {}).value || "";
  if (!email.trim() || pw.length < 6) { authMsg("Enter your email and a password of at least 6 characters.", true); return null; }
  return {email: email.trim(), password: pw};
}
Object.assign(actions, {
  async "c-signin"(){
    const v = authInputs(); if (!v) return; authMsg("Signing in…");
    const { error } = await Cloud.sb.auth.signInWithPassword(v);
    if (error) authMsg(error.message.includes("confirm") ? "Confirm your email first: open the link Supabase sent you, then sign in here." : error.message, true);
  },
  async "c-signup"(){
    const v = authInputs(); if (!v) return; authMsg("Creating your account…");
    const { data, error } = await Cloud.sb.auth.signUp(v);
    if (error) return authMsg(error.message, true);
    if (!data.session) authMsg("Account created. Open the confirmation email, then come back and tap Sign in.");
  },
  "c-sync"(){ Cloud.sync(); },
  "c-ask-signout"(){ state.overlay = {type:"confirm", title:"Sign out?", text:"Your beans stay safe in your account. They'll be removed from this phone until you sign in again.", ok:"Sign out", act:"c-signout"}; render(); },
  async "c-signout"(){
    state.overlay = null;
    await Cloud.sync();
    if (Cloud.dirty.size) { toast("Some changes haven't synced yet. Try again when you're online."); render(); return; }
    await Cloud.sb.auth.signOut();
    state.beans = []; Cloud.lsSet("dialin.syncUser", null); Cloud.dirty.clear(); Cloud.saveDirty(); writeLocal();
    render(); toast("Signed out");
  },
});
/* ================= share image (canvas) ================= */
const FONT_SPEC = {condensed:['900', '"Big Shoulders Display", "Arial Narrow", sans-serif', true], serif:['400', '"DM Serif Display", Georgia, serif', false], mono:['600', '"IBM Plex Mono", monospace', true], script:['400', 'Yellowtail, cursive', false]};
function wrap(ctx, text, maxW, maxLines){
  const words = text.split(/\s+/), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur);
  return lines.length > maxLines ? null : lines;
}
async function drawCard(b){
  const t = themeOf(b), W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), [fw, ff, upper] = FONT_SPEC[b.labelFont] || FONT_SPEC.condensed;
  try { await Promise.all([document.fonts.load('700 40px "Big Shoulders Display"'), document.fonts.load('500 24px "IBM Plex Mono"'), document.fonts.load('700 24px "Instrument Sans"'), document.fonts.load(`${fw} 80px ${ff}`)]); } catch {}
  const isDarkPaper = inkFor(t.paper) === LIGHT;
  ctx.fillStyle = isDarkPaper ? "#E9E2D6" : "#1B1816"; ctx.fillRect(0, 0, W, H);
  const cx = 150, cy = 90, cw = 780, ch = 1110, pad = 54;
  ctx.fillStyle = t.paper; ctx.fillRect(cx, cy, cw, ch);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // flavour notes
  ctx.fillStyle = t.ink; let fs = 54; const notes = (b.flavour || "").toUpperCase();
  let nl; do { ctx.font = `700 ${fs}px "Big Shoulders Display", sans-serif`; nl = wrap(ctx, notes, cw - pad*2, 2); fs -= 2; } while (!nl && fs > 24);
  (nl || [notes]).forEach((ln, i, a) => ctx.fillText(ln, W/2, cy + 110 + (i - (a.length-1)/2) * fs * 1.05));
  // label
  const lx = cx + pad, ly = cy + 200, lw = cw - pad*2, lh = 380, style = b.labelStyle || "block";
  let txt = t.li;
  if (style === "outline") { ctx.fillStyle = t.paper; ctx.fillRect(lx, ly, lw, lh); ctx.strokeStyle = t.label; ctx.lineWidth = 6; ctx.strokeRect(lx+3, ly+3, lw-6, lh-6); ctx.lineWidth = 3; ctx.strokeRect(lx+16, ly+16, lw-32, lh-32); txt = t.label; }
  else { ctx.fillStyle = t.label; ctx.fillRect(lx, ly, lw, lh); ctx.strokeStyle = t.ink; ctx.lineWidth = 6; ctx.strokeRect(lx+3, ly+3, lw-6, lh-6);
    if (style === "banded") { ctx.fillStyle = t.li; ctx.globalAlpha = .9; ctx.fillRect(lx+6, ly+26, lw-12, 12); ctx.fillRect(lx+6, ly+lh-38, lw-12, 12); ctx.globalAlpha = 1; } }
  ctx.fillStyle = txt;
  const name = upper ? (b.name||"").toUpperCase() : (b.name||"");
  let ns = 130, lines;
  do { ctx.font = `${fw} ${ns}px ${ff}`; lines = wrap(ctx, name, lw - 70, 2); ns -= 4; } while (!lines && ns > 36);
  lines = lines || [name];
  const sub = [b.brand, b.origin].filter(Boolean).map(s => s.toUpperCase());
  const blockH = lines.length * ns * 1.0 + sub.length * 34 + (sub.length ? 22 : 0);
  let y = ly + lh/2 - blockH/2 + ns*0.5;
  lines.forEach(ln => { ctx.fillText(ln, W/2, y); y += ns * 1.0; });
  ctx.font = '500 24px "IBM Plex Mono", monospace'; if ("letterSpacing" in ctx) ctx.letterSpacing = "5px";
  y += 4; sub.forEach(s => { ctx.fillText(s, W/2, y); y += 34; });
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  // table
  const tx = lx, ty = ly + lh + 40, tw = lw, bh = 84, rh = 86, sh = 96, th = bh + rh*2 + sh;
  ctx.fillStyle = t.band; ctx.fillRect(tx, ty, tw, bh);
  ctx.strokeStyle = t.ink; ctx.lineWidth = 5; ctx.strokeRect(tx, ty, tw, th);
  ctx.lineWidth = 6;
  [[tx, ty+bh, tx+tw, ty+bh], [tx, ty+bh+rh, tx+tw, ty+bh+rh], [tx, ty+bh+rh*2, tx+tw, ty+bh+rh*2], [tx+tw/2, ty+bh, tx+tw/2, ty+bh+rh*2]]
    .forEach(([a, c, d, e]) => { ctx.beginPath(); ctx.moveTo(a, c); ctx.lineTo(d, e); ctx.stroke(); });
  ctx.fillStyle = t.bi; ctx.font = '700 30px "Instrument Sans", sans-serif'; ctx.textAlign = "left";
  ctx.fillText(b.mode === "espresso" ? "SHOTS LOGGED" : "POURS LOGGED", tx + 26, ty + bh/2);
  ctx.textAlign = "right"; ctx.fillText(String((b.logs||[]).length), tx + tw - 26, ty + bh/2);
  ctx.textAlign = "center"; ctx.fillStyle = t.ink; ctx.font = '500 26px "IBM Plex Mono", monospace';
  const cells = [b.roast ? (b.roast + " roast").toUpperCase() : "—", (b.process || "—").toUpperCase(), fmtDot(b.roastDate) || "—", b.grams ? b.grams + " G" : "—"];
  cells.forEach((c, i) => { const col = i % 2, row = Math.floor(i / 2); let s = c; while (ctx.measureText(s).width > tw/2 - 30 && s.length > 3) s = s.slice(0, -2) + "…"; ctx.fillText(s, tx + tw/4 + col*tw/2, ty + bh + rh*row + rh/2); });
  ctx.font = '44px "Instrument Sans", sans-serif';
  for (let i = 0; i < 5; i++) { ctx.globalAlpha = i < (b.rating||0) ? 1 : .25; ctx.fillText("★", W/2 + (i - 2) * 64, ty + bh + rh*2 + sh/2); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = isDarkPaper ? "#1B1816" : "#EFE7DB"; ctx.font = '800 34px "Big Shoulders Display", sans-serif'; if ("letterSpacing" in ctx) ctx.letterSpacing = "4px";
  ctx.fillText("DIAL-IN · COFFEE JOURNAL", W/2, cy + ch + 74);
  return cv;
}
async function shareFlow(b){
  const dl = await getSaver();
  state.overlay = {type:"share", name:b.name, canSave:!!dl, dl}; render();
  try {
    const cv = await drawCard(b);
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    if (!state.overlay || state.overlay.type !== "share") return;
    state.overlay.src = cv.toDataURL("image/png"); state.overlay.blob = blob;
    document.getElementById("layer").innerHTML = vOverlay();
  } catch { toast("Couldn't draw the card."); state.overlay = null; render(); }
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== "dismiss") e.preventDefault();
  fn(el, e);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && state.overlay) { state.overlay = null; render(); }
});
const NUMERIC = new Set(["grams","dose","water","yield","time","temp"]);
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.color && state.draft) {
    if (isHex(el.value)) { state.draft.custom[el.dataset.color] = el.value; previewRefresh();
      const sw = document.querySelector('[data-v="custom"] .sw'); if (sw) { const c = state.draft.custom; sw.style.background = c.paper; sw.style.setProperty("--swi", inkFor(c.paper)); sw.children[0].style.background = c.label; sw.children[1].style.background = c.band; } }
    return;
  }
  const k = el.dataset.f; if (!k) return;
  const target = state.screen === "log-form" ? state.logDraft : state.draft; if (!target) return;
  let v = el.value;
  if (NUMERIC.has(k)) { v = k === "grams" || k === "time" ? v.replace(/\D/g, "").slice(0, k === "time" ? 3 : L.grams) : cleanNum(v, L.num); if (v !== el.value) el.value = v; }
  target[k] = v;
  const cnt = document.querySelector(`[data-cnt="${k}"]`);
  if (cnt) { const max = +el.getAttribute("maxlength") || L[k]; cnt.textContent = `${v.length}/${max}`; cnt.classList.toggle("full", v.length >= max); }
  if (state.screen === "bean-form") { previewRefresh(); const sb = document.getElementById("save-bean"); if (sb) sb.disabled = !(state.draft.name || "").trim(); }
  if (state.screen === "log-form") { const r = document.getElementById("ratio"); const b = getBean(state.params.id); if (r && b) r.textContent = ratioOf(target.dose, b.mode === "espresso" ? target.yield : target.water); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.time && state.logDraft) {
    const m = +document.getElementById("f-min").value, s = +document.getElementById("f-sec").value;
    state.logDraft.time = m * 60 + s; return;
  }
  if (el.id === "import-file" && el.files && el.files[0]) {
    const f = el.files[0], r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result); if (!data || !Array.isArray(data.beans)) throw 0;
        let n = 0;
        data.beans.forEach(b => { if (b && typeof b === "object" && b.id && typeof b.name === "string") { Store.saveBean(b); n++; } });
        render(); toast(n ? `Imported ${n} ${n === 1 ? "bag" : "bags"}` : "No bags found in that file");
      } catch { toast("That file isn't a Dial-In backup."); }
    };
    r.readAsText(f); el.value = "";
  }
});

Store.init();
})();
